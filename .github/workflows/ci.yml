name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        env:
          # Optional: add this repository secret to also run the live Claude test.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --console=plain 2>&1 | tee build.log
      - name: Summarise result
        if: always()
        run: |
          enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed -e 's/\r/%0D/g'; }
          echo "::notice title=Tests::$(grep -E ' (PASSED|FAILED|SKIPPED)$' build.log | sed 's/^/ /' | enc)"
          if grep -q 'BUILD SUCCESSFUL' build.log; then exit 0; fi
          grep -nE '^e: |error:|FAILED|Exception|Caused by|What went wrong' build.log | head -60 | enc > errors.txt
          echo "::error title=Build errors::$(cat errors.txt)"
          echo "::error title=Failed tests::$(grep -A12 -E 'FAILED$' build.log | grep -vE '^\s+at ' | head -120 | enc)"
          echo "::error title=Build log tail::$(tail -120 build.log | enc)"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: build/reports/tests
