<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic Banking POC</title>
  <style>
    :root {
      --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6860; --line: #e4e1da;
      --accent: #0b5cff; --ok: #137a3f; --warn: #a15c00; --bad: #b42318; --chip: #f0eee9;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe7; --muted: #a09d95; --line: #2e2d2a;
              --accent: #6f9bff; --ok: #4cc27f; --warn: #e3a64a; --bad: #f2786d; --chip: #2a2926; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
    header h1 { font-size: 17px; margin: 0; font-weight: 650; }
    header .meta { color: var(--muted); font-size: 13px; }
    main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; padding: 16px 24px; max-width: 1240px; margin: 0 auto; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
    section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; height: 60vh; }
    .msg { max-width: 88%; padding: 10px 13px; border-radius: 10px; white-space: pre-wrap; }
    .user { align-self: flex-end; background: var(--accent); color: #fff; }
    .agent { align-self: flex-start; background: var(--chip); }
    .system { align-self: center; color: var(--muted); font-size: 13px; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
    input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
    button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
    .suggestions button { font-size: 13px; padding: 5px 9px; background: var(--chip); border: none; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
    .stat { background: var(--panel); padding: 12px 16px; }
    .stat .k { font-size: 12px; color: var(--muted); }
    .stat .v { font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 600; }
    #proposals { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
    .status { font-size: 11px; font-weight: 650; letter-spacing: .04em; padding: 2px 7px; border-radius: 99px; background: var(--chip); }
    .PENDING_APPROVAL { color: var(--warn); } .APPROVED { color: var(--ok); } .REJECTED_POLICY, .DECLINED { color: var(--bad); }
    .card .reason { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
    .card .actions { display: flex; gap: 6px; }
    .empty { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
<header>
  <h1>Agentic Banking POC</h1>
  <span class="meta" id="meta">Loading…</span>
</header>
<main>
  <section>
    <h2>Agent</h2>
    <div id="log"></div>
    <div class="suggestions" id="suggestions"></div>
    <form id="form">
      <input type="text" id="input" autocomplete="off" placeholder="Ask about the account or ask for a payment…">
      <button class="primary" id="send">Send</button>
    </form>
  </section>
  <section>
    <h2>Account and approvals</h2>
    <div class="stats" id="stats"></div>
    <div id="proposals"></div>
  </section>
</main>
<script>
  const eur = n => new Intl.NumberFormat('en-NL', { style: 'currency', currency: 'EUR' }).format(n);
  const $ = id => document.getElementById(id);
  let conversationId = null;

  const suggestions = [
    "What's my balance and how much can I still spend?",
    "Summarise last week's transactions and flag anything unusual.",
    "Pay Example Supplier BV €1,000 for invoice 1043.",
    "Also pay Big Vendor BV €8,000.",
  ];
  suggestions.forEach(s => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = s;
    b.onclick = () => { $('input').value = s; $('form').requestSubmit(); };
    $('suggestions').append(b);
  });

  function add(kind, text) {
    const d = document.createElement('div'); d.className = 'msg ' + kind; d.textContent = text;
    $('log').append(d); $('log').scrollTop = $('log').scrollHeight; return d;
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || res.statusText);
    return body;
  }

  async function refresh() {
    const [b, props] = await Promise.all([api('/api/finance/balance'), api('/api/finance/payment-proposals')]);
    $('meta').textContent = `${b.accountName} · data source: ${b.dataSource}`;
    $('stats').innerHTML = [
      ['Available', b.availableBalance], ['Reserved by proposals', b.reservedForProposals],
      ['Policy minimum', b.minimumRequiredBalance], ['Spendable above minimum', b.spendableAboveMinimum],
    ].map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${eur(v)}</div></div>`).join('');
    const box = $('proposals'); box.innerHTML = '';
    if (!props.length) { box.innerHTML = '<div class="empty">No payment proposals yet.</div>'; return; }
    props.forEach(p => {
      const c = document.createElement('div'); c.className = 'card';
      c.innerHTML = `<div class="top"><strong></strong><span class="amount">${eur(p.amount)}</span></div>
        <div class="reason"></div>
        <div class="top"><span class="status ${p.status}">${p.status.replace('_', ' ')}</span><span class="actions"></span></div>`;
      c.querySelector('strong').textContent = p.beneficiary + (p.reference ? ` · ${p.reference}` : '');
      c.querySelector('.reason').textContent = p.reason;
      if (p.status === 'PENDING_APPROVAL') {
        for (const [label, action] of [['Approve', 'approve'], ['Decline', 'decline']]) {
          const btn = document.createElement('button'); btn.textContent = label;
          if (action === 'approve') btn.className = 'primary';
          btn.onclick = async () => {
            try { await api(`/api/finance/payment-proposals/${p.id}/${action}`, { method: 'POST', body: JSON.stringify({ approver: 'demo-user' }) }); }
            catch (e) { add('system', e.message); }
            refresh();
          };
          c.querySelector('.actions').append(btn);
        }
      }
      box.append(c);
    });
  }

  $('form').onsubmit = async e => {
    e.preventDefault();
    const message = $('input').value.trim(); if (!message) return;
    $('input').value = ''; $('send').disabled = true;
    add('user', message);
    const pending = add('system', 'Thinking…');
    try {
      const r = await api('/api/agent/chat', { method: 'POST', body: JSON.stringify({ message, conversationId }) });
      conversationId = r.conversationId; pending.remove(); add('agent', r.reply);
    } catch (err) { pending.textContent = err.message; }
    $('send').disabled = false; refresh();
  };

  api('/api/agent/status').then(s => {
    add('system', s.llmConfigured
      ? 'Synthetic data. The agent can read the account and prepare payments; only you can approve them.'
      : 'No LLM configured: set ANTHROPIC_API_KEY and restart. The panel on the right still works.');
  });
  refresh().catch(e => add('system', e.message));
</script>
</body>
</html>
